# Linux CI on Depot (modeled on maschwenk/tsrs's .depot/workflows/ci.yml). Releases: .github/workflows/release.yml.
# Local actions for Depot CI live under .depot/actions/.

name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  check-and-test:
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version from package.json "packageManager"; Node from .node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # @types/node at the repository root: some no-deprecated rule cases import node modules.
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo build
        run: cargo build --release --locked
      - name: Rule tests
        run: cargo test --release --locked --test rule_tests
      - name: Headless smoke test
        run: node npm/smoke.mjs target/release/tsgolint
      - name: npm packaging smoke test
        run: |
          node npm/build.mjs --binary x86_64-unknown-linux-gnu=target/release/tsgolint --pack
          npm/smoke-install.sh npm/dist
