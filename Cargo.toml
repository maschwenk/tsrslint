[workspace]
resolver = "2"
members = ["crates/tsrslint"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

# tsrs (the Rust port of the TypeScript 7 checker) supplies the program, binder and type checker.
[workspace.dependencies]
tsrs_core = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_ast = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_scanner = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_checker = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_compiler = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_tsoptions = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_vfs = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_diagnostics = { git = "https://github.com/maschwenk/tsrs", branch = "main" }

[profile.release]
opt-level = 3
debug = "line-tables-only"
panic = "unwind"

# Release binaries (.github/workflows/release.yml) build with this profile twice, for PGO: -Cprofile-generate,
# training run (.github/scripts/pgo-train.sh), -Cprofile-use (docs/perf-pgo.md). `cargo build --release` stays the
# development build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Clippy's default groups stay on (docs/porting.md: clippy clean). The lints below are added on top: they catch what
# a port from Go gets wrong in Rust (copies and allocations Go does not make, unsound `unsafe`, leftovers). It is the
# set tsrs uses. Everything is a warning so that `cargo clippy` reports all of it; the gate is tools/lint/ratchet.py,
# which fails when a (lint, file) count grows. docs/rust-practices.md explains.
all = { level = "warn", priority = -1 }

# A `.clone()` that remains is a real copy.
redundant_clone = "warn"
clone_on_copy = "warn"
implicit_clone = "warn"
clone_on_ref_ptr = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"

# Allocations nobody asked for.
format_push_string = "warn"
inefficient_to_string = "warn"
needless_collect = "warn"
unnecessary_box_returns = "warn"
rc_buffer = "warn"
vec_box = "warn"
stable_sort_primitive = "warn"

# Argument passing and stack use.
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
inline_always = "warn"

# Hashing and iteration order (clippy.toml bans the SipHash std maps).
disallowed_types = "warn"
set_contains_or_insert = "warn"
zero_sized_map_values = "warn"
iter_over_hash_type = "warn"

# Locks and threads.
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
significant_drop_in_scrutinee = "warn"
non_send_fields_in_send_ty = "warn"

# `unsafe` (clippy.toml lists the unchecked operations that need a measured reason).
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
borrow_as_ptr = "warn"
cast_ptr_alignment = "warn"
as_ptr_cast_mut = "warn"
transmute_ptr_to_ptr = "warn"
mem_forget = "warn"
disallowed_methods = "warn"

# Leftovers and escape hatches. A suppression is `#[expect(lint, reason = "...")]`, never a bare `#[allow]`.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
disallowed_macros = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
