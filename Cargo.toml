[workspace]
resolver = "2"
members = ["crates/tsrslint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# tsrs (the Rust port of the TypeScript 7 checker) supplies the program, binder and type checker.
# Branch `lint-api` only widens the visibility of a few checker methods that lint rules need.
[workspace.dependencies]
tsrs_core = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_ast = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_scanner = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_checker = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_compiler = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_tsoptions = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_vfs = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }
tsrs_diagnostics = { git = "https://github.com/maschwenk/tsrs", branch = "lint-api" }

[profile.release]
opt-level = 3
debug = "line-tables-only"
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
