# Linux CI and Windows build/package checks on GitHub-hosted runners. Benchmark: bench.yml. Releases: release.yml.

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Pull requests: a new push cancels the PR's running CI. main and dispatches: one run per commit, never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs/rules.md's rule table must match the rule test cases, the pinned upstream rule list and the newest bench
      # result.
      - name: Rule coverage table
        run: python3 tools/rule_coverage.py --check docs/rules.md
      # README.md's bench table and the charts bench/*.svg must show the newest complete bench result.
      - name: Benchmark table and charts
        run: python3 bench/publish.py --check
      # pnpm version from package.json "packageManager"; Node from .node-version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # @types/node at the repository root: some no-deprecated rule cases import node modules.
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo build
        run: cargo build --release --locked
      - name: Rule tests
        run: cargo test --release --locked --test rule_tests
      - name: Headless smoke test
        run: node npm/smoke.mjs target/release/tsgolint
      - name: npm packaging smoke test
        run: |
          node --test npm/build.test.mjs
          node npm/build.mjs --binary x86_64-unknown-linux-gnu=target/release/tsgolint --pack
          node npm/smoke-install.mjs npm/dist

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build
        run: cargo build --profile dist --locked --target x86_64-pc-windows-msvc
      - name: Headless smoke test
        run: node npm/smoke.mjs target/x86_64-pc-windows-msvc/dist/tsgolint.exe
      - name: npm packaging tests
        run: node --test npm/build.test.mjs
      - name: npm packaging smoke test
        run: |
          node npm/build.mjs --binary x86_64-pc-windows-msvc=target/x86_64-pc-windows-msvc/dist/tsgolint.exe --pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node npm/smoke-install.mjs npm/dist

  # docs/rust-practices.md: clippy findings per (lint, file) may not grow past tools/lint/baseline.tsv.
  lint-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-ratchet
      - name: Lint ratchet
        run: python3 tools/lint/ratchet.py --self-test && python3 tools/lint/ratchet.py
      # Unsafe Send/Sync inventory and comments on weakened atomic orderings (docs/rust-practices.md).
      - name: Source checks
        run: python3 tools/lint/source.py --self-test && python3 tools/lint/source.py
