# Builds the tsrslint binaries and publishes the npm packages (npm/README.md). Modeled on maschwenk/tsrs's release
# workflow. Lint CI (fmt, rule tests, packaging smoke test): .github/workflows/ci.yml.
#
# Setup before the first release:
#   - npm trusted publishing (https://docs.npmjs.com/trusted-publishers) on @maschwenk/tsrslint and on each
#     @maschwenk/tsrslint-<os>-<cpu> package: GitHub Actions, owner maschwenk, repository tsrslint, workflow
#     release.yml, no environment. The publish job authenticates with its OIDC token; there is no npm token.
#   - push the tag v<workspace version> (node npm/build.mjs --print-version), e.g. v0.1.0.
# workflow_dispatch builds, smoke-tests and packs, then runs `npm publish --dry-run` unless dry_run is unchecked.
# Provenance (`npm publish --provenance`) is only possible from a public repository; it is enabled automatically
# when the repository is public and skipped while it is private.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but run `npm publish --dry-run`"
        type: boolean
        default: true

# One release per ref at a time; never cancel a publish half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then node npm/build.mjs --check-tag "$GITHUB_REF_NAME"; fi
          echo "version=$(node npm/build.mjs --print-version)" >> "$GITHUB_OUTPUT"

  # Release binaries are PGO builds with the `dist` profile (fat LTO, one codegen unit; Cargo.toml): an instrumented
  # build of the tsgolint binary and the rule test suite, the training workload (.github/scripts/pgo-train.sh: the rule
  # tests and two open-source projects with all 59 rules), then the final build with the merged profile. Method and
  # numbers: docs/perf-pgo.md. Each binary is smoke-tested on its own platform: the headless protocol on
  # npm/smoke/fixture, directly and through the packed npm packages.
  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          # Built on 22.04 so the binary needs at most glibc 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, exe: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # @types/node at the repository root: the rule tests of the training workload need it (as in CI).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Read the pinned Rust toolchain (rust-toolchain.toml)
        id: rust
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-pgo
      # Everything of the PGO steps but the final build lives outside target/, which rust-cache saves.
      # `cargo test --no-run` builds the integration test and the tsgolint binary; both link the same crate units
      # (the tsrslint lib, the tsrs crates), so the test's counts apply to the binary.
      # CFLAGS: cc passes -Cprofile-generate/-use on to clang (macOS) but not to gcc (Linux). Apple clang's profile
      # format does not have to match rustc's LLVM (maschwenk/tsrs saw the instrumented mimalloc crash in
      # __llvm_profile_instrument_target), so the C code (mimalloc) is built without PGO, as on Linux.
      - name: Instrumented build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-generate=${{ runner.temp }}/pgo/raw
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-generate' || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/pgo/target
        run: |
          mkdir -p "$RUNNER_TEMP/pgo"
          cargo test --profile dist --locked -p tsrslint --test rule_tests --no-run --target ${{ matrix.target }} \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/pgo/artifacts.jsonl"
          node -e '
            const fs = require("node:fs");
            const exes = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean).map(JSON.parse)
              .filter(m => m.reason === "compiler-artifact" && m.executable);
            for (const name of ["tsgolint", "rule_tests"]) {
              const m = exes.find(m => m.target.name === name);
              if (!m) { console.error("no executable for " + name); process.exit(1); }
              fs.mkdirSync(process.argv[2], { recursive: true });
              fs.copyFileSync(m.executable, process.argv[2] + "/" + name + "${{ matrix.exe }}");
            }' "$RUNNER_TEMP/pgo/artifacts.jsonl" "$RUNNER_TEMP/pgo/bin"
      # Runs the workload and merges the raw profiles (weighted; see the script) with rustup's llvm-profdata.
      - name: Training run
        id: profile
        shell: bash
        run: |
          .github/scripts/pgo-train.sh "$RUNNER_TEMP/pgo/bin/tsgolint${{ matrix.exe }}" "$RUNNER_TEMP/pgo/bin/rule_tests${{ matrix.exe }}" \
            "$RUNNER_TEMP/pgo/work" "$RUNNER_TEMP/pgo/merged.profdata"
          # The profile's hash is part of its path, and so of RUSTFLAGS: cargo then rebuilds dependencies restored by
          # rust-cache whenever the profile changes.
          sum=$(node -p 'require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex").slice(0, 16)' "$RUNNER_TEMP/pgo/merged.profdata")
          mv "$RUNNER_TEMP/pgo/merged.profdata" "$RUNNER_TEMP/pgo/$sum.profdata"
          echo "path=$RUNNER_TEMP/pgo/$sum.profdata" >> "$GITHUB_OUTPUT"
      - name: cargo build
        shell: bash
        env:
          RUSTFLAGS: -Cprofile-use=${{ steps.profile.outputs.path }}
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-profile-use' || '' }}
        run: cargo build --profile dist --locked -p tsrslint --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/dist/tsgolint${{ matrix.exe }}" "out/${{ matrix.target }}/tsgolint${{ matrix.exe }}"
      - name: Headless smoke test
        run: node npm/smoke.mjs "out/${{ matrix.target }}/tsgolint${{ matrix.exe }}"
      - name: npm packaging smoke test
        shell: bash
        run: |
          node npm/build.mjs --binary "${{ matrix.target }}=out/${{ matrix.target }}/tsgolint${{ matrix.exe }}" --pack --out "$RUNNER_TEMP/npm"
          node npm/smoke-install.mjs "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@^11.5.1 && npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Require the release platforms
        run: |
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "artifacts/$t/tsgolint" || { echo "::error::missing binary for $t"; exit 1; }
          done
          test -f artifacts/x86_64-pc-windows-msvc/tsgolint.exe || { echo "::error::missing Windows x64 binary"; exit 1; }
          ls -lR artifacts
      - name: Assemble and pack
        run: node npm/build.mjs --artifacts artifacts --pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm/dist/*.tgz
      - name: Publish (platform packages first, then the main package)
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          VERSION: ${{ needs.version.outputs.version }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          flags=(--access public --tag latest)
          [ "$PRIVATE_REPO" = false ] && flags+=(--provenance)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          node -e 'for (const p of require("./npm/dist/packages.json").packages) console.log(p.name + " " + p.tarball)' |
          while read -r name tarball; do
            # Re-running a partially published release skips what is already on the registry.
            if [ "$DRY_RUN" != true ] && npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published"
              continue
            fi
            npm publish "$tarball" "${flags[@]}"
          done
