[package]
name = "tsrslint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of tsgolint's headless type-aware linter, on top of tsrs"

[[bin]]
name = "tsgolint"
path = "src/main.rs"

[lib]
name = "tsrslint"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_scanner.workspace = true
tsrs_checker.workspace = true
tsrs_compiler.workspace = true
tsrs_tsoptions.workspace = true
tsrs_vfs.workspace = true
tsrs_diagnostics.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
rayon = "1.12"
regex = "1"
mimalloc = { version = "0.1.52", optional = true }

[features]
default = ["mimalloc"]
# The headless binary's global allocator. A host that links tsrslint (oxlint's `tsrslint` feature) turns it off and
# keeps its own.
mimalloc = ["dep:mimalloc"]
# Allocation profile (tsrs_core/alloc-profile); replaces the mimalloc global allocator with tsrs's counting one.
alloc-profile = ["tsrs_core/alloc-profile"]

[dev-dependencies]
tsrs_parser = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
